<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cowork 應用分享平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* ── 日式清新配色 ── */
  /* 背景：温かみのある和紙クリーム */
  --bg: #f5f3ee;
  --surface: #fffffe;
  --surface-2: #faf8f4;
  --border: #e6dfd4;
  --border-soft: #ede8e0;

  /* 文字：墨色系 */
  --ink: #2b2520;
  --ink-2: #4a4038;
  --ink-3: #7c7068;
  --ink-4: #a89e94;

  /* 主色：浅葱（あさぎ）淡いティール */
  --accent: #4d8b9a;
  --accent-soft: #e8f4f6;

  /* 補色 */
  --up: #b85c5c;          /* 紅梅 */
  --up-soft: #f7eaea;
  --down: #4d7a8a;        /* 浅葱 dark */
  --down-soft: #e8f0f4;
  --green: #5e8c6a;       /* 苔緑 */
  --green-soft: #eaf2eb;
  --purple: #7d6e9e;      /* 藤 */
  --purple-soft: #f0edf7;
  --orange: #b07840;      /* 黄土 */
  --orange-soft: #f5eedd;

  --radius: 14px;
  --radius-sm: 8px;
  --radius-pill: 999px;
  --shadow-xs: 0 1px 3px rgba(43,37,32,.05);
  --shadow-sm: 0 2px 8px rgba(43,37,32,.07), 0 1px 2px rgba(43,37,32,.04);
  --shadow-md: 0 4px 18px rgba(43,37,32,.09), 0 1px 4px rgba(43,37,32,.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",Inter,Arial,sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1, "kern" 1;
}

/* ─── Page Header ─── */
.page-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 32px 16px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: saturate(180%) blur(8px);
}
.header-inner {
  max-width: 1320px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, #4d8b9a, #6baab8);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 17px; letter-spacing: -.5px;
  box-shadow: 0 2px 8px rgba(77,139,154,.30);
  flex-shrink: 0;
}
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.2px; color: var(--ink); }
.brand .sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stat-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: var(--radius-pill);
  font-size: 12px; color: var(--ink-3);
}
.stat-pill strong { color: var(--ink); font-weight: 700; font-size: 14px; }
.date-pill {
  background: var(--accent-soft); color: var(--accent);
  padding: 6px 14px; border-radius: var(--radius-pill);
  font-weight: 600; font-size: 12px; letter-spacing: .2px;
}

/* ─── Main Layout ─── */
.main-wrap {
  max-width: 1320px; margin: 0 auto;
  padding: 28px 32px 60px;
}

/* ─── Hero Stats ─── */
.hero-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px; margin-bottom: 28px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow-xs);
  display: flex; align-items: center; gap: 14px;
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.stat-card:hover {
  border-color: rgba(77,139,154,.2);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.stat-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.stat-icon.blue { background: var(--accent-soft); }
.stat-icon.green { background: var(--green-soft); }
.stat-icon.purple { background: var(--purple-soft); }
.stat-icon.orange { background: var(--orange-soft); }
/* stat icons 換成配色對應的 stroke */
.stat-icon.blue svg { stroke: var(--accent); }
.stat-icon.green svg { stroke: var(--green); }
.stat-icon.purple svg { stroke: var(--purple); }
.stat-icon.orange svg { stroke: var(--orange); }
.stat-num { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

/* ─── Toolbar ─── */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
}
.search-wrap {
  position: relative; flex: 1; max-width: 360px;
}
.search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink-4); pointer-events: none;
}
.search-input {
  width: 100%; padding: 9px 14px 9px 38px;
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  background: var(--surface); font-family: inherit; font-size: 13px;
  color: var(--ink); outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
  border-color: rgba(77,139,154,.4);
  box-shadow: 0 0 0 3px rgba(77,139,154,.09);
}
.search-input::placeholder { color: var(--ink-4); }

.view-toggle { display: flex; gap: 2px; }
.view-btn {
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 8px 10px; cursor: pointer; color: var(--ink-3);
  font-size: 13px; transition: all .15s;
  display: flex; align-items: center;
}
.view-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.view-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.view-btn.active {
  background: #4d8b9a; border-color: #4d8b9a;
  color: #fff;
}

/* ─── Dept Tabs ─── */
.dept-tabs {
  display: flex; gap: 2px; flex-wrap: wrap;
  background: var(--surface-2); padding: 4px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 22px;
}
.dept-btn {
  background: transparent; border: none;
  padding: 7px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--ink-3);
  border-radius: 6px; font-family: inherit;
  transition: all .15s ease; display: flex; align-items: center; gap: 6px;
}
.dept-btn:hover { color: var(--ink); background: rgba(255,255,255,.7); }
.dept-btn.active { color: var(--ink); background: var(--surface); box-shadow: var(--shadow-xs); }
.dept-btn .count {
  font-size: 10px; font-weight: 700;
  background: var(--accent-soft); color: #3d7a8a;
  padding: 1px 6px; border-radius: var(--radius-pill);
}
.dept-btn.active .count {
  background: #4d8b9a; color: #fff;
}

/* ─── Card Grid ─── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.card-grid.list-view { grid-template-columns: 1fr; }

/* ─── App Card ─── */
.app-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-xs);
  overflow: hidden;
  transition: border-color .2s, transform .2s, box-shadow .2s;
  cursor: pointer; position: relative;
}
.app-card::after {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #4d8b9a, #7d6e9e);
  border-radius: var(--radius) 0 0 var(--radius);
  opacity: 0; transform: scaleY(.6);
  transition: opacity .2s, transform .2s;
}
.app-card:hover {
  border-color: rgba(77,139,154,.32);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md), 0 0 0 3px rgba(77,139,154,.08);
}
.app-card:hover::after { opacity: 1; transform: scaleY(1); }

.card-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: flex-start; gap: 12px;
}
.card-avatar {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700; color: #fff;
  flex-shrink: 0; letter-spacing: -.5px;
}
.card-meta { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
.card-dept-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dept-chip {
  font-size: 10px; font-weight: 700; letter-spacing: .3px;
  padding: 2px 7px; border-radius: var(--radius-pill);
  text-transform: uppercase; flex-shrink: 0;
}
/* 日式清新：単位バッジ配色 */
.dept-chip.mis  { background: #e8f4f6; color: #3d7a8a; }       /* 浅葱 */
.dept-chip.biz  { background: #eaf2eb; color: #4d7a58; }       /* 苔緑 */
.dept-chip.fin  { background: var(--purple-soft); color: #6a5d8a; }  /* 藤 */
.dept-chip.hr   { background: #f5ede8; color: #8a5040; }       /* 紅梅 */
.dept-chip.prod { background: #edf3e8; color: #4a6e3a; }       /* 若草 */
.dept-chip.it   { background: #f5f0e8; color: #8a6830; }       /* 黄土 */
.person-title { font-size: 11px; color: var(--ink-4); }

.card-body { padding: 14px 18px; }
.card-app-title {
  font-size: 14px; font-weight: 700; color: var(--ink);
  margin-bottom: 6px; line-height: 1.4;
}
.card-desc {
  font-size: 12.5px; color: var(--ink-3); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  padding: 10px 18px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-size: 10px; font-weight: 600; letter-spacing: .2px;
  padding: 3px 8px; border-radius: var(--radius-pill);
  background: var(--surface-2); color: var(--ink-3);
  border: 1px solid var(--border-soft);
}
.card-date { font-size: 11px; color: var(--ink-4); flex-shrink: 0; font-variant-numeric: tabular-nums; }

.card-action {
  display: flex; align-items: center; gap: 8px;
  margin: 0 18px 14px;
  padding: 9px 14px; border-radius: var(--radius-sm);
  background: var(--accent-soft); border: 1px solid rgba(77,139,154,.15);
  font-size: 12.5px; font-weight: 600; color: #3d7a8a;
  transition: background .15s, border-color .15s;
}
.app-card:hover .card-action { background: rgba(77,139,154,.12); border-color: rgba(77,139,154,.25); }
.card-action svg { flex-shrink: 0; }
.card-action-text { flex: 1; }
.card-action-arrow { margin-left: auto; opacity: .6; }

/* ─── List View ─── */
.card-grid.list-view .app-card { cursor: default; }
.card-grid.list-view .app-card:hover { transform: translateY(-1px); }
.list-row {
  display: flex; align-items: center; gap: 16px; padding: 16px 20px;
  flex-wrap: wrap;
}
.list-row .card-avatar { width: 36px; height: 36px; font-size: 15px; border-radius: 9px; }
.list-row .card-meta { flex: 0 0 auto; min-width: 140px; }
.list-row .list-content { flex: 1; min-width: 200px; }
.list-row .list-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.list-row .list-desc { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.list-row .list-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.list-view-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 14px; border-radius: var(--radius-pill);
  background: var(--accent-soft); border: 1px solid rgba(77,139,154,.15);
  color: #3d7a8a; font-size: 12px; font-weight: 600;
  cursor: pointer; text-decoration: none;
  transition: background .15s;
  font-family: inherit;
}
.list-view-btn:hover { background: rgba(77,139,154,.15); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(15,23,42,.5); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; width: 100%; max-width: 540px;
  box-shadow: 0 20px 60px rgba(15,23,42,.15);
  overflow: hidden;
  transform: translateY(12px) scale(.97); transition: transform .25s;
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-header {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: flex-start; gap: 14px;
}
.modal-avatar {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.modal-info { flex: 1; }
.modal-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.modal-sub { font-size: 12.5px; color: var(--ink-3); }
.modal-close {
  background: var(--surface-2); border: 1px solid var(--border);
  width: 30px; height: 30px; border-radius: 50%;
  cursor: pointer; color: var(--ink-3); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; line-height: 1;
}
.modal-close:hover { background: var(--up-soft); color: var(--up); border-color: #f5d5d5; }
.modal-body { padding: 20px 24px; }
.modal-section-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--ink-4); margin-bottom: 6px;
}
.modal-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 18px; }
.modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.modal-tag {
  padding: 4px 10px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--ink-3);
}
.modal-files { display: flex; flex-direction: column; gap: 8px; }
.file-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  text-decoration: none; color: var(--ink-2);
  transition: all .15s; cursor: pointer;
}
.file-item:hover {
  background: var(--accent-soft); border-color: rgba(77,139,154,.2); color: #3d7a8a;
}
.file-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 14px;
}
.file-icon.html { background: #e0f2fe; }
.file-icon.xlsx { background: var(--green-soft); }
.file-icon.pdf { background: var(--up-soft); }
.file-icon.pptx { background: var(--orange-soft); }
.file-name { flex: 1; font-size: 13px; font-weight: 500; }
.file-size { font-size: 11px; color: var(--ink-4); }
.file-arrow { color: var(--ink-4); }
.file-item:hover .file-arrow { color: var(--accent); }

/* ─── Prompt Block ─── */
.prompt-box {
  background: #f8f7f4;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 20px;
  position: relative;
}
.prompt-text {
  font-size: 12.5px; color: var(--ink-2); line-height: 1.75;
  white-space: pre-wrap; word-break: break-all;
  font-family: "Noto Sans TC","Microsoft JhengHei",sans-serif;
  max-height: 120px; overflow-y: auto;
}
.prompt-copy-btn {
  position: absolute; top: 8px; right: 8px;
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--radius-pill);
  background: var(--surface); border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.prompt-copy-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: rgba(77,139,154,.25); }
.prompt-copy-btn.copied { background: var(--green-soft); color: var(--green); border-color: rgba(94,140,106,.25); }

.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-soft); text-align: right; }
.modal-btn-close {
  padding: 8px 20px; border-radius: var(--radius-pill);
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.modal-btn-close:hover { background: var(--border); }

/* ─── Empty State ─── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--ink-3); display: none;
}
.empty-state.show { display: block; }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.empty-sub { font-size: 13px; }

/* ─── Footer ─── */
.footer {
  margin-top: 48px; padding: 20px 32px;
  font-size: 11px; color: var(--ink-4); text-align: center;
  border-top: 1px solid var(--border);
}

/* ─── Section Head ─── */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 16px;
}
.section-head h2 {
  font-size: 15px; font-weight: 700; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.section-head .hint { font-size: 12px; color: var(--ink-4); }
.results-count {
  font-size: 12px; font-weight: 600;
  background: var(--accent-soft); color: #3d7a8a;
  padding: 3px 10px; border-radius: var(--radius-pill);
}

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .page-header { padding: 14px 18px 12px; }
  .main-wrap { padding: 20px 18px 48px; }
  .card-grid { grid-template-columns: 1fr; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .list-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- ─── Page Header ─── -->
<div class="page-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">共</div>
      <div>
        <h1>Cowork 應用分享平台</h1>
        <div class="sub">公司同仁 AI 應用成果展示</div>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-pill"><strong id="totalCount">12</strong>&ensp;個應用</div>
      <div class="stat-pill"><strong id="deptCount">6</strong>&ensp;個單位</div>
      <div class="date-pill">更新日期&ensp;2026-05-08</div>
    </div>
  </div>
</div>

<!-- ─── Main ─── -->
<div class="main-wrap">

  <!-- Hero Stats -->
  <div class="hero-stats" id="heroStats">
    <div class="stat-card">
      <div class="stat-icon blue">
        <svg width="20" height="20" fill="none" stroke="#3b5bdb" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <div class="stat-num" id="stat-people">23</div>
        <div class="stat-label">參與人員</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">
        <svg width="20" height="20" fill="none" stroke="#0f9d8a" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </div>
      <div>
        <div class="stat-num" id="stat-apps">12</div>
        <div class="stat-label">應用案例</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon purple">
        <svg width="20" height="20" fill="none" stroke="#7c5cff" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>

function getInitials(name) {
  return name.charAt(0);
}

function deptChipClass(dept) {
  const map = { mis: 'mis', biz: 'biz', fin: 'fin', hr: 'hr', prod: 'prod', it: 'it' };
  return map[dept] || 'it';
}

function filteredApps() {
  return APPS.filter(app => {
    const matchDept = currentDept === 'all' || app.dept === currentDept;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      app.person.includes(q) ||
      app.title.toLowerCase().includes(q) ||
      app.desc.toLowerCase().includes(q) ||
      app.tags.some(t => t.toLowerCase().includes(q)) ||
      app.deptLabel.includes(q);
    return matchDept && matchSearch;
  });
}

───────────────────────────────────────── */
function renderCards() {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const apps = filteredApps();
  const badge = document.getElementById('resultsCountBadge');
  badge.textContent = apps.length + ' 筆';

  if (apps.length === 0) {
    grid.innerHTML = '';
    grid.style.display = 'none';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');
  grid.style.display = '';

  if (currentView === 'list') {
    grid.className = 'card-grid list-view';
    grid.innerHTML = apps.map(app => renderListRow(app)).join('');
  } else {
    grid.className = 'card-grid';
    grid.innerHTML = apps.map(app => renderCard(app)).join('');
  }
}

  const grad = `linear-gradient(135deg, ${app.color[0]}, ${app.color[1]})`;
  const chip = deptChipClass(app.dept);
  const tags = app.tags.map(t => `<span class="tag">${t}</span>`).join('');
  const fileLabel = app.files.length > 1 ? `${app.files.length} 個成果檔案` : app.files[0].name;
  return `
  <div class="app-card" onclick="openModal(${app.id})">
    <div class="card-header">
      <div class="card-avatar" style="background: ${grad}">${getInitials(app.person)}</div>
      <div class="card-meta">
        <div class="card-name">${app.person}</div>
        <div class="card-dept-row">
          <span class="dept-chip ${chip}">${app.deptLabel}</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-app-title">${app.title}</div>
      <div class="card-desc">${app.desc}</div>
    </div>
    <div class="card-footer">
      <div class="card-tags">${tags}</div>
      <div class="card-date">${app.date}</div>
    </div>
    <div class="card-action">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="card-action-text">${fileLabel}</span>
      <svg class="card-action-arrow" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </div>
  </div>`;
}

function renderListRow(app) {
  const grad = `linear-gradient(135deg, ${app.color[0]}, ${app.color[1]})`;
  const chip = deptChipClass(app.dept);
  const tags = app.tags.map(t => `<span class="tag">${t}</span>`).join('');
  return `
  <div class="app-card">
    <div class="list-row">
      <div class="card-avatar" style="background: ${grad}">${getInitials(app.person)}</div>
      <div class="card-meta">
        <div class="card-name">${app.person}</div>
        <div class="card-dept-row"><span class="dept-chip ${chip}">${app.deptLabel}</span></div>
      </div>
      <div class="list-content">
        <div class="list-title">${app.title}</div>
        <div class="list-desc">${app.desc.substring(0, 60)}…</div>
      </div>
      <div class="card-tags" style="flex:none">${tags}</div>
      <div class="list-right">
        <div class="card-date">${app.date}</div>
        <button class="list-view-btn" onclick="openModal(${app.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          查看成果
        </button>
      </div>
    </div>
  </div>`;
}

/* ─────────────────────────────────────────
   Filter
───────────────────────────────────────── */
function filterDept(dept, btn) {
  currentDept = dept;
  document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const hint = document.getElementById('filterHint');
  hint.textContent = dept === 'all' ? '顯示全部單位' : `篩選：${btn.textContent.trim().replace(/\d+/g, '').trim()}`;
  renderCards();
}

function setView(view) {
  currentView = view;
  document.getElementById('gridViewBtn').classList.toggle('active', view === 'grid');
  document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
  renderCards();
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentSearch = this.value;
  renderCards();
});

/* ─────────────────────────────────────────
   Modal
───────────────────────────────────────── */
function openModal(id) {
  const app = APPS.find(a => a.id === id);
  if (!app) return;

  const grad = `linear-gradient(135deg, ${app.color[0]}, ${app.color[1]})`;
  const chip = deptChipClass(app.dept);

  document.getElementById('modalAvatar').style.background = grad;
  document.getElementById('modalAvatar').textContent = getInitials(app.person);
  document.getElementById('modalTitle').textContent = app.title;
  document.getElementById('modalSub').innerHTML =
    `<span class="dept-chip ${chip}" style="display:inline-flex">${app.deptLabel}</span>&ensp;${app.person}&ensp;·&ensp;${app.date}`;

  document.getElementById('modalDesc').textContent = app.desc;

  document.getElementById('modalPrompt').textContent = app.prompt || '（尚未提供）';
  document.getElementById('promptCopyBtn').classList.remove('copied');
  document.getElementById('promptCopyBtn').innerHTML = `
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    複製`;

  document.getElementById('modalTags').innerHTML =
    app.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');

  document.getElementById('modalFiles').innerHTML = app.files.map(f => {
    const fi = FILE_ICONS[f.type] || { icon: '◻', bg: '#f1f5f9', label: f.type.toUpperCase() };
    return `
    <a class="file-item" href="${f.name}" target="_blank" onclick="event.stopPropagation()">
      <div class="file-icon ${f.type}" style="background:${fi.bg}; color: ${app.color[0]}; font-size:16px">${fi.icon}</div>
      <div class="file-name">${f.name}</div>
      <div class="file-size">${f.size}</div>
      <svg class="file-arrow" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </a>`;
  }).join('');

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function copyPrompt() {
  const text = document.getElementById('modalPrompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('promptCopyBtn');
    btn.classList.add('copied');
    btn.innerHTML = `
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      已複製`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        複製`;
    }, 2000);
  });
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
});

/* ─────────────────────────────────────────
   Init
───────────────────────────────────────── */
renderCards();
</script>
</body>
</html>
